name: Build and publish desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.2.3"
        required: true
        type: string
      ref:
        description: "要打包的分支或 tag"
        required: false
        default: main
        type: string

concurrency:
  group: package-${{ inputs.version }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon (M)
            platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
            artifact: macos-arm64
          - name: macOS Intel
            platform: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
            artifact: macos-x64
          - name: Windows x64
            platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            architecture: x64
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      TAURI_TARGET: ${{ matrix.target }}
      UXPLAY_COMMIT: d19d22adcf1314124ecf4c27cbc5cf0ae7d05f83

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Windows GStreamer runtime
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkg-config
            base-devel

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set build version
        shell: bash
        run: node scripts/set-release-version.mjs "$RELEASE_VERSION"

      - name: Install Intel macOS UxPlay build dependencies
        if: matrix.artifact == 'macos-x64'
        run: brew install pkg-config gstreamer libplist openssl@3

      - name: Build audited UxPlay for Intel macOS
        if: matrix.artifact == 'macos-x64'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/UxPlay"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/FDH2/UxPlay
          git -C "$source_dir" fetch --quiet --depth 1 origin "$UXPLAY_COMMIT"
          git -C "$source_dir" checkout --quiet --detach "$UXPLAY_COMMIT"
          cmake -S "$source_dir" -B "$source_dir/build" -DNO_MARCH_NATIVE=ON
          cmake --build "$source_dir/build" --parallel "$(sysctl -n hw.ncpu)"
          install -m 755 "$source_dir/build/uxplay" src-tauri/binaries/uxplay

      - name: Prepare Windows UxPlay build environment
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $prefix = Join-Path $env:MSYS2_LOCATION "ucrt64"
          "PHONEBRIDGE_GSTREAMER_PREFIX=$prefix" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$(Join-Path $prefix 'lib\pkgconfig')" >> $env:GITHUB_ENV
          (Join-Path $prefix "bin") >> $env:GITHUB_PATH

      - name: Fetch audited UxPlay source for Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = Join-Path $env:RUNNER_TEMP "UxPlay"
          git init --quiet $sourceDir
          git -C $sourceDir remote add origin https://github.com/FDH2/UxPlay
          git -C $sourceDir fetch --quiet --depth 1 origin $env:UXPLAY_COMMIT
          git -C $sourceDir checkout --quiet --detach $env:UXPLAY_COMMIT
          $actualCommit = (git -C $sourceDir rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:UXPLAY_COMMIT) {
            throw "UxPlay 提交不匹配：$actualCommit；预期 $env:UXPLAY_COMMIT"
          }

      - name: Build audited UxPlay for Windows (MSYS2)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
        run: |
          set -euo pipefail
          source_dir="$(cygpath -u "$RUNNER_TEMP/UxPlay")"
          cd "$source_dir"
          cmake -B build -G "Unix Makefiles" -DNO_MARCH_NATIVE=ON
          cmake --build build --parallel
          test -f build/uxplay.exe

      - name: Collect audited Windows UxPlay binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $sourceDir = Join-Path $env:RUNNER_TEMP "UxPlay"
          $buildDir = Join-Path $sourceDir "build"
          $uxplay = Join-Path $buildDir "uxplay.exe"
          if (-not (Test-Path -LiteralPath $uxplay -PathType Leaf)) {
            throw "UxPlay Windows 构建未生成 uxplay.exe"
          }
          Copy-Item -LiteralPath $uxplay -Destination (Join-Path $env:GITHUB_WORKSPACE "src-tauri\binaries\uxplay.exe") -Force

      - name: Prepare macOS sidecars
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAURI_TARGET" == "x86_64-apple-darwin" ]]; then
            node scripts/bundle-uxplay-runtime.mjs --refresh
          else
            node scripts/bundle-uxplay-runtime.mjs
          fi
          pnpm sidecars:ble

      - name: Prepare Windows sidecars
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pnpm sidecars:ble
          node scripts/bundle-uxplay-runtime.mjs

      - name: Build BLE-compatible macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          CI=true pnpm exec tauri build --target "$TAURI_TARGET" --bundles dmg
          TAURI_TARGET="$TAURI_TARGET" node scripts/sign-macos-dmg.mjs

      - name: Build BLE-compatible Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:CI = "true"
          pnpm exec tauri build --target $env:TAURI_TARGET --bundles nsis,msi

      - name: Collect macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          dmg="$(find "src-tauri/target/$TAURI_TARGET/release/bundle/dmg" -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "未找到 DMG 输出" >&2
            exit 1
          fi
          cp "$dmg" "package/PhoneBridge-${RELEASE_VERSION}-macos-${{ matrix.architecture }}.dmg"

      - name: Collect Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $nsis = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\$env:TAURI_TARGET\release\bundle\nsis") -Filter "*.exe" -File | Select-Object -First 1
          $msi = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\$env:TAURI_TARGET\release\bundle\msi") -Filter "*.msi" -File | Select-Object -First 1
          if ($null -eq $nsis -or $null -eq $msi) {
            throw "未找到 NSIS 或 MSI 输出"
          }
          Copy-Item -LiteralPath $nsis.FullName -Destination (Join-Path $packageDir "PhoneBridge-$env:RELEASE_VERSION-windows-x64-setup.exe")
          Copy-Item -LiteralPath $msi.FullName -Destination (Join-Path $packageDir "PhoneBridge-$env:RELEASE_VERSION-windows-x64.msi")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-${{ matrix.artifact }}
          path: package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          expected_sha="${GITHUB_SHA}"
          tag_sha=""
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$expected_sha" ]]; then
              echo "标签 ${tag} 已存在，但指向 ${tag_sha}，预期 ${expected_sha}；为避免覆盖已有版本而停止。" >&2
              exit 1
            fi
            echo "标签 ${tag} 已存在且指向本次构建提交 ${expected_sha}。"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${expected_sha}" >/dev/null
            echo "已创建标签 ${tag} -> ${expected_sha}。"
          fi

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "没有可发布的安装包" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "快投屏 ${RELEASE_VERSION}" --generate-notes
          fi
